<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditate — It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    <link rel="icon" href="vitruvian-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">
    <div id="app-container" class="app-container meditate-page">
        <header class="meditate-header">
            <a href="index.html" class="meditate-back" aria-label="Back to home">← Home</a>
            <h1 class="meditate-title">Meditate</h1>
        </header>

        <section class="meditate-stage">
            <div id="meditate-display" class="meditate-display" role="timer" aria-live="polite">10:00</div>
            <p id="meditate-status" class="meditate-status">10 minute session</p>
            <button id="meditate-toggle" type="button" class="panel-btn meditate-btn" aria-pressed="false">Start</button>
            <div id="meditate-sound-modes" class="meditate-sound-modes" aria-label="Sound mode">
                <button type="button" class="meditate-sound-mode" data-mode="bell" aria-pressed="true">Bell</button>
                <button type="button" class="meditate-sound-mode" data-mode="om" aria-pressed="false">OM</button>
                <button type="button" class="meditate-sound-mode" data-mode="noise" aria-pressed="false">Noise</button>
                <button type="button" class="meditate-sound-mode" data-mode="off" aria-pressed="false">Off</button>
            </div>
        </section>

        <section id="meditate-breath" class="meditate-breath" aria-hidden="true">
            <div class="meditate-breath__stage">
                <div class="meditate-breath__ring"></div>
                <span class="meditate-breath__label meditate-breath__label--inhale">Breathe in</span>
                <span class="meditate-breath__label meditate-breath__label--hold-1">Hold</span>
                <span class="meditate-breath__label meditate-breath__label--exhale">Breathe out</span>
                <span class="meditate-breath__label meditate-breath__label--hold-2">Hold</span>
            </div>
        </section>

        <section class="meditate-presets" aria-label="Session length">
            <button type="button" class="meditate-preset" data-duration="5" aria-pressed="false">5 min</button>
            <button type="button" class="meditate-preset" data-duration="10" aria-pressed="true">10 min</button>
            <button type="button" class="meditate-preset" data-duration="20" aria-pressed="false">20 min</button>
        </section>

        <section class="meditate-stats-section" aria-label="Session stats">
            <div class="meditate-stats">
                <div class="meditate-stat">
                    <span class="meditate-stat__value" id="meditate-stat-week">0</span>
                    <span class="meditate-stat__label">sessions</span>
                </div>
                <div class="meditate-stat">
                    <span class="meditate-stat__value" id="meditate-stat-streak">0</span>
                    <span class="meditate-stat__label">day streak</span>
                </div>
                <div class="meditate-stat">
                    <span class="meditate-stat__value" id="meditate-stat-total">0</span>
                    <span class="meditate-stat__label">total min</span>
                </div>
            </div>
        </section>

        <section class="meditate-history-section" aria-labelledby="meditate-history-heading">
            <h2 id="meditate-history-heading" class="meditate-history-heading">Recent sessions</h2>
            <div id="meditate-history" class="meditate-history">
                <p class="meditate-history__empty">No sessions yet.</p>
            </div>
        </section>
    </div>

    <script type="module" src="src/pages/meditate.ts"></script>
</body>
</html>
