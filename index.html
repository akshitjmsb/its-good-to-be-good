<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the core UI face (Special Elite) is render-blocking. The Indic
         script faces (Devanagari/Nastaliq/Gurmukhi) are loaded on demand by
         src/utils/scriptFonts.ts the first time a quote in that script shows. -->
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    
    <!-- All styles moved to external CSS files -->
    <link rel="icon" href="/vitruvian-logo.svg" type="image/svg+xml">
    <!-- Apple / PWA home-screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">

    <div id="app-container" class="app-container">
        <!-- Slim top bar: refresh on the left, quantum timer on the right.
             Sits flush against the top of the app-container so the hero area
             (logo + title + chip + date) gets its own clean stack. -->
        <div class="app-header-bar">
            <button id="header-refresh-btn" type="button" class="header-refresh" aria-label="Reload">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
                    <polyline points="21 3 21 8 16 8"/>
                </svg>
            </button>
            <div class="quantum-timer-container flex items-center space-x-2">
                <span id="quantum-timer-display" class="font-mono text-sm font-bold text-gray-700">30:00</span>
                <button id="quantum-timer-btn" class="panel-btn text-xs py-1 px-2">Quantum</button>
            </div>
        </div>

        <!-- Main App Header -->
        <header class="text-center mb-6">
            <div class="logo-container flex justify-center">
                <img class="logo-svg" src="/vitruvian-man-mono.png"
                     alt="It's Good To Be King — Vitruvian Man logo"
                     width="398" height="366" decoding="async" />
            </div>
            <h1>It's Good To Be King</h1>
            <!-- User chip — populated by src/auth/userChip.ts when signed in.
                 Tucks under the title as quiet journal metadata. -->
            <div id="user-chip" class="user-chip" hidden></div>
            <p id="current-datetime" class="text-xs mt-2"></p>
        </header>

        <!-- Sync Status -->
        <div id="sync-status" class="hidden text-center text-sm text-gray-600 bg-gray-100 p-2 rounded-md mb-4 transition-opacity duration-300"></div>

        <!-- DYNAMIC MODULE (Always visible, content adapts based on time) -->
        <div id="day-module" class="module active">
            <!-- REFLECT SECTION -->
            <section>
                <div id="life-pointer-display-day" class="life-pointer"></div>
            </section>
            
            <!-- NAVIGATION BUTTONS SECTION -->
            <section class="mobile-section">
                <div class="nav-carousel-wrap">
                    <!-- Icons are inlined statically so they paint with the document
                         (no JS/auth wait). They mirror src/utils/iconRenderer.ts, which
                         re-injects the same SVGs and layers any user emoji overrides on top. -->
                    <div class="nav-carousel" role="list">
                        <a href="todo.html"
                           class="nav-item"
                           role="listitem"
                           data-module="todo"
                           aria-label="Navigate to To do page"
                           title="View and manage your tasks">
                            <div class="nav-icon" id="todo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4" /><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" /></svg></div>
                            <h2>To do</h2>
                        </a>

                        <a href="tennis.html"
                           class="nav-item"
                           role="listitem"
                           data-module="tennis"
                           aria-label="Navigate to Tennis page"
                           title="A roadmap from cradle to centre court">
                            <div class="nav-icon" id="tennis-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M3.5 6.5c4 2.5 13 2.5 17 0" /><path d="M3.5 17.5c4-2.5 13-2.5 17 0" /></svg></div>
                            <h2>Tennis</h2>
                        </a>

                        <a href="khyaali-bhoot.html"
                           class="nav-item"
                           role="listitem"
                           data-module="khyaali-bhoot"
                           aria-label="Navigate to Khyaali Bhoot page"
                           title="Talk to your imaginary ghosts">
                            <div class="nav-icon" id="khyaali-bhoot-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8 2 5 5.6 5 10v7c0 1 .5 2 1.5 2s1.5-1 2-2c.5 1 1.5 2 2.5 2s2-1 2.5-2c.5 1 1 2 2 2s1.5-1 1.5-2v-7c0-4.4-3-8-7-8z" /><circle cx="9.5" cy="10" r="0.5" /><circle cx="14.5" cy="10" r="0.5" /></svg></div>
                            <h2>Khyaali Bhoot</h2>
                        </a>

                        <a href="being.html"
                           class="nav-item"
                           role="listitem"
                           data-module="being"
                           aria-label="Navigate to Being page"
                           title="Meditate and exercise — stillness and movement">
                            <div class="nav-icon" id="being-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c1.7 2.4 1.7 5.6 0 8-1.7-2.4-1.7-5.6 0-8z" /><path d="M12 12C9.8 9.4 6.7 8 3.5 8c0 3.3 2.3 6.2 5.5 7" /><path d="M12 12c2.2-2.6 5.3-4 8.5-4 0 3.3-2.3 6.2-5.5 7" /><path d="M4 12.5c1.6 2.7 4.7 4.5 8 4.5s6.4-1.8 8-4.5" /></svg></div>
                            <h2>Being</h2>
                        </a>
                    </div>
                </div>
                <!-- Today's lift — a quiet glance at the PPL+Upper rotation.
                     Schedule mirrors src/modules/being/exercise-data.ts; it's a
                     fixed weekly rotation so the day map is inlined here rather
                     than imported, keeping this paint with the document. -->
                <p id="today-workout" class="workout-indicator" aria-live="polite"></p>
                <script>
                    (function () {
                        var schedule = ['Rest', 'Push', 'Rest', 'Pull', 'Rest', 'Legs', 'Upper'];
                        var el = document.getElementById('today-workout');
                        if (el) el.textContent = schedule[new Date().getDay()] + ' Day';
                    })();
                </script>
            </section>

            <!-- LEARN SECTION -->
            <section class="mobile-section">
                <h2>Learn</h2>
                <div class="category-grid grid grid-cols-3 gap-3 sm:gap-2 mt-3">
                    <button id="food-clickable-day" type="button" class="preview-card cursor-pointer module-card" data-module="food" aria-label="Open Food module" title="Open Food module">
                        <div class="module-icon" id="food-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8" /><path d="M8 4l1 1 1-1" /><path d="M8 6v8" /><path d="M7 6h2" /><path d="M7 8h2" /><path d="M16 4l-1 1-1-1" /><path d="M16 6v8" /><path d="M15 6h2" /><path d="M15 8h2" /><circle cx="12" cy="12" r="3" /></svg></div>
                        <h3 class="font-bold text-sm sm:text-xs">Food</h3>
                    </button>
                </div>
            </section>
        </div>

        <footer class="text-center mt-8 py-4 border-t">
            <!-- Footer content removed for simplicity -->
        </footer>
    
        <!-- MODALS -->
        <div id="food-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center p-4 z-50">
            <div class="modal-content-panel p-4 rounded-lg max-w-4xl w-full mx-auto max-h-[90vh] flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="food-modal-title" class="text-lg font-bold">Food</h3>
                    <button class="modal-close-btn text-3xl leading-none font-bold hover:text-black">&times;</button>
                </div>
                <div id="food-content" class="overflow-y-auto flex-grow"></div>
            </div>
        </div>
    </div>

    <script type="module" src="src/index.tsx"></script>
</body>
</html>
