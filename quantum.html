    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">

    <meta name="apple-mobile-web-app-capable" content="yes">

<body class="home-vintage-lock">
    <div id="app-container" class="app-container quantum-page">
        <header class="quantum-header">
            <a href="index.html" class="quantum-back" aria-label="Back to home">← Home</a>
            <h1 class="quantum-title">Quantum</h1>
        </header>

        <section class="quantum-stage">
            <div id="quantum-timer-display" class="quantum-display" role="timer" aria-live="polite">30:00</div>
            <p id="quantum-status" class="quantum-status">30 minute focus session</p>
            <button id="quantum-timer-btn" type="button" class="panel-btn quantum-btn" aria-pressed="false">Start</button>
        </section>

        <section class="quantum-history-section" aria-labelledby="quantum-history-heading">
            <h2 id="quantum-history-heading" class="quantum-history-heading">Recent sessions</h2>
            <div id="quantum-history" class="quantum-history">
                <p class="quantum-history__empty">No sessions yet.</p>
            </div>
        </section>
    </div>

    <script type="module" src="src/pages/quantum.ts"></script>
