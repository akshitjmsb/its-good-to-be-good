<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum - It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>
    <div id="app-container" class="app-container">
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="logo-container flex justify-center">
                <svg class="logo-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                    <title>It's Good To Be King Logo</title>
                    <path d="M70,35 C 72,50 68,65 65,68" />
                    <path d="M60,25 C 62,45 58,68 55,70" />
                    <path d="M50,23 C 52,43 48,70 45,72" />
                    <path d="M40,28 C 42,48 38,68 35,70" />
                </svg>
            </div>
            <div class="flex justify-center items-center">
                <h1>Quantum Timer</h1>
                <span class="theme-icon">⚛️</span>
            </div>
            <p class="text-xs mt-2">Focus sessions and productivity tracking</p>
        </header>

        <!-- Navigation -->
        <nav class="text-center mb-6">
            <a href="index.html" class="todo-toggle-button">
                <h2>← Back to Dashboard</h2>
            </a>
        </nav>

        <!-- Quantum Timer Section -->
        <section class="mobile-section">
            <div class="text-center">
                <div id="quantum-timer-display" class="text-4xl font-mono font-bold text-gray-700 mb-4">30:00</div>
                <button id="quantum-timer-btn" class="todo-toggle-button mb-4">
                    <h2>Start Quantum Session</h2>
                </button>
                <div class="text-sm text-gray-600">
                    <p>Focus deeply for 30 minutes</p>
                    <p>Break the cycle of distraction</p>
                </div>
            </div>
        </section>

        <!-- Session History -->
        <section class="mobile-section">
            <h2 class="text-center mb-4">Recent Sessions</h2>
            <div id="session-history" class="space-y-2">
                <div class="text-center text-gray-500 text-sm">
                    No sessions yet. Start your first quantum session!
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="src/pages/quantum.ts"></script>
</body>
</html>
