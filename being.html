<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Being — It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    <link rel="icon" href="/vitruvian-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">
    <div id="app-container" class="app-container being-page meditate-page">
        <nav class="page-back-nav">
            <a href="index.html" class="home-link">← Home</a>
        </nav>

        <header class="text-center mb-6">
            <div class="flex justify-center items-center">
                <h1>Being</h1>
            </div>
        </header>

        <!-- Stillness — the resting state. The Vitruvian Man sits at the centre;
             every practice orbits it as a quiet captioned icon. Nothing else is
             on screen until a practice is tapped. -->
        <section class="being-orbit" role="group" aria-label="Being practices">
            <div class="being-orbit__figure" aria-hidden="true">
                <img class="being-figure" src="/vitruvian-man.jpg"
                     alt="" width="441" height="600" decoding="async" />
            </div>

            <!-- Orbit launchers. Breathe / OM / Sleep reveal the meditation timer
                 (OM & Sleep also toggle their ambient loop via meditate ids).
                 Stretch / Weights / Tennis / Guided open the practice panel. -->
            <button type="button" class="orbit-icon" data-mode="breathe" style="--a:0deg" aria-label="Breathe — guided session">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M5 8h8.5a2.5 2.5 0 1 0 -2.5 -2.5"></path>
                        <path d="M3 12h15a3 3 0 1 1 -3 3"></path>
                        <path d="M4 16h6.5a2 2 0 1 1 -2 2"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Breathe</span>
            </button>

            <button id="meditate-om-toggle" type="button" class="orbit-icon" data-mode="om" style="--a:51.429deg" aria-pressed="false" aria-label="OM chant">
                <span class="orbit-icon__glyph orbit-icon__glyph--om" aria-hidden="true">ॐ</span>
                <span class="orbit-icon__label">OM</span>
            </button>

            <button id="meditate-sleep-toggle" type="button" class="orbit-icon" data-mode="sleep" style="--a:102.857deg" aria-pressed="false" aria-label="Sleep music">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Sleep</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="stretch" style="--a:154.286deg" aria-expanded="false" aria-controls="being-panel" aria-label="Stretch routines">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="9" cy="4.5" r="1.8"></circle>
                        <path d="M9 6.5c0 4 3 5.5 6.5 5.5"></path>
                        <path d="M9 8.5l-2.5 6"></path>
                        <path d="M15 12l2 5"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Stretch</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="weights" style="--a:205.714deg" aria-expanded="false" aria-controls="being-panel" aria-label="Weight training plan">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="12" r="3"></circle>
                        <path d="M9 12h6"></path>
                        <path d="M6 9v6"></path>
                        <path d="M18 9v6"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Weights</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="tennis" style="--a:257.143deg" aria-expanded="false" aria-controls="being-panel" aria-label="Tennis stretches">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M4 7c4 2.5 12 2.5 16 0"></path>
                        <path d="M4 17c4-2.5 12-2.5 16 0"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Tennis</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="guided" style="--a:308.571deg" aria-expanded="false" aria-controls="being-panel" aria-label="Guided meditation">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M10 8.5l5.5 3.5-5.5 3.5z"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Guided</span>
            </button>
        </section>

        <!-- Activity stage — hidden until a practice is tapped. Holds either the
             meditation timer (Breathe / OM / Sleep) or the practice panel
             (Stretch / Weights / Tennis / Guided). One at a time. -->
        <section id="being-stage" class="being-stage" aria-live="polite" hidden>
            <button type="button" id="being-stage-close" class="being-stage__close" aria-label="Return to stillness">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M15 6l-6 6 6 6"></path>
                </svg>
                <span>Stillness</span>
            </button>

            <!-- Meditation timer — revealed by Breathe / OM / Sleep. -->
            <div id="being-meditate" class="being-meditate" hidden>
                <div class="meditate-stage">
                    <div id="meditate-display" class="meditate-display" role="timer" aria-live="polite">10:00</div>
                    <p id="meditate-status" class="meditate-status">10 minute session</p>
                    <button id="meditate-toggle" type="button" class="panel-btn meditate-btn" aria-pressed="false">Start</button>
                    <section class="meditate-presets" aria-label="Session length">
                        <button type="button" class="meditate-preset" data-duration="5" aria-pressed="false">5 min</button>
                        <button type="button" class="meditate-preset" data-duration="10" aria-pressed="true">10 min</button>
                        <button type="button" class="meditate-preset" data-duration="20" aria-pressed="false">20 min</button>
                    </section>
                </div>

                <section id="meditate-breath" class="meditate-breath" aria-hidden="true">
                    <div class="meditate-breath__stage">
                        <div class="meditate-breath__ring"></div>
                        <span class="meditate-breath__label meditate-breath__label--inhale">Breathe in</span>
                        <span class="meditate-breath__label meditate-breath__label--hold-1">Hold</span>
                        <span class="meditate-breath__label meditate-breath__label--exhale">Breathe out</span>
                        <span class="meditate-breath__label meditate-breath__label--hold-2">Hold</span>
                    </div>
                </section>

                <!-- Breath-chime toggle. OM & Sleep live in the orbit; the chime
                     is the one ambient control that belongs with the timer. -->
                <div class="being-sounds" role="group" aria-label="Ambient sound">
                    <button id="meditate-breathe-toggle" type="button" class="being-sound-toggle" aria-pressed="true" aria-label="Breath chime">
                        <span class="being-sound-toggle__glyph">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M11 5 6 9H2v6h4l5 4z"></path>
                                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                                <path d="M19 5a9 9 0 0 1 0 14"></path>
                            </svg>
                        </span>
                        <span>Chime</span>
                    </button>
                </div>
            </div>

            <!-- Practice panel — Stretch / Weights / Tennis / Guided. -->
            <div id="being-panel" class="being-panel" hidden></div>
        </section>

        <!-- A quiet contemplation verse — the resting thought below the orbit. -->
        <section class="being-verse" aria-label="Contemplation verse" lang="hi">
            <p class="being-verse__line">ज़िंदगी भर किया इंतज़ार,</p>
            <p class="being-verse__line">होगा मेरे साथ भी कुछ चमत्कार।</p>
            <p class="being-verse__line">पर ज़िंदगी का मेरी कुछ ना बना,</p>
            <p class="being-verse__line">मैं खटखटाता रहा किस्मत मुझे करती रही मना।</p>
            <p class="being-verse__line being-verse__line--punch">पर चमत्कार हुआ तब, जादूगर जब मैं खुद बना।</p>
        </section>
    </div>

    <script type="module" src="src/pages/being.ts"></script>
</body>
</html>
