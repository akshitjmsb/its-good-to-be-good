<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Being — It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    <link rel="icon" href="/vitruvian-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">
    <div id="app-container" class="app-container being-page meditate-page">
        <nav class="page-back-nav">
            <a href="index.html" class="home-link">← Home</a>
        </nav>

        <header class="text-center mb-6">
            <div class="flex justify-center items-center">
                <h1>Being</h1>
            </div>
        </header>

        <!-- Stillness — the resting state. The Vitruvian Man sits at the centre;
             every practice orbits it as a quiet captioned icon. Nothing else is
             on screen until a practice is tapped. -->
        <section class="being-orbit" role="group" aria-label="Being practices">
            <div class="being-orbit__figure" aria-hidden="true">
                <svg class="logo-svg being-figure" viewBox="0 0 520 505" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
                    <!-- Geometry -->
                    <circle cx="260" cy="252" r="208" stroke-width="1.2"/>
                    <rect x="52" y="84" width="416" height="416" stroke-width="1.2"/>
                    <!-- Head -->
                    <circle cx="260" cy="114" r="32" stroke-width="1.8"/>
                    <!-- Hair -->
                    <path d="M229,101 C227,91 231,83 237,85 C236,77 240,72 245,79 C246,72 250,68 254,79" stroke-width="0.9" stroke-linecap="round"/>
                    <path d="M254,79 C256,70 260,68 264,79" stroke-width="0.9" stroke-linecap="round"/>
                    <path d="M264,79 C268,70 272,70 275,79 C278,72 283,72 284,83 C289,80 290,91 288,101" stroke-width="0.9" stroke-linecap="round"/>
                    <path d="M230,104 C232,90 244,84 260,84 C276,84 288,90 290,104" stroke-width="0.9"/>
                    <!-- Ears -->
                    <path d="M228,114 C222,112 221,121 227,123" stroke-width="0.9" stroke-linecap="round"/>
                    <path d="M292,114 C298,112 299,121 293,123" stroke-width="0.9" stroke-linecap="round"/>
                    <!-- Neck -->
                    <path d="M248,146 L244,166" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M272,146 L276,166" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Collarbone -->
                    <path d="M244,166 Q210,162 150,170" stroke-width="0.9"/>
                    <path d="M276,166 Q310,162 370,170" stroke-width="0.9"/>
                    <!-- Torso left -->
                    <path d="M150,170 C133,177 127,194 136,214 C140,226 144,235 216,255 L206,292 C200,305 197,318 214,332 L240,340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Torso right -->
                    <path d="M370,170 C387,177 393,194 384,214 C380,226 376,235 304,255 L314,292 C320,305 323,318 306,332 L280,340" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Crotch -->
                    <path d="M240,340 Q260,348 280,340" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Sternum -->
                    <line x1="260" y1="166" x2="260" y2="224" stroke-width="0.9"/>
                    <!-- Pectorals -->
                    <path d="M244,170 C238,180 228,192 218,202" stroke-width="0.9" stroke-linecap="round"/>
                    <path d="M276,170 C282,180 292,192 302,202" stroke-width="0.9" stroke-linecap="round"/>
                    <!-- Abs -->
                    <path d="M230,216 L252,216 M268,216 L290,216" stroke-width="0.75"/>
                    <path d="M226,228 L252,228 M268,228 L294,228" stroke-width="0.75"/>
                    <path d="M222,240 L252,240 M268,240 L298,240" stroke-width="0.75"/>
                    <!-- Navel -->
                    <circle cx="260" cy="254" r="2.8" fill="currentColor" stroke="none"/>
                    <!-- Horizontal arms -->
                    <path d="M150,170 C124,173 98,175 74,176 C66,177 58,176 52,178" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M370,170 C396,173 422,175 446,176 C454,177 462,176 468,178" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Raised arms -->
                    <path d="M150,170 C128,157 106,143 86,131 C78,126 70,120 62,112" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M370,170 C392,157 414,143 434,131 C442,126 450,120 458,112" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Together legs -->
                    <path d="M240,340 C236,360 232,383 234,406 C235,424 236,447 236,464 L234,496" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M280,340 C284,360 288,383 286,406 C285,424 284,447 284,464 L286,496" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Together feet -->
                    <path d="M234,496 C224,500 208,500 194,496" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M286,496 C296,500 312,500 326,496" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Spread legs -->
                    <path d="M240,340 C220,362 196,388 170,413 C152,432 133,452 114,474" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M280,340 C300,362 324,388 350,413 C368,432 387,452 406,474" stroke-width="1.8" stroke-linecap="round"/>
                    <!-- Spread feet -->
                    <path d="M114,474 C102,478 88,479 76,475" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M406,474 C418,478 432,479 444,475" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Orbit launchers. Breathe / OM / Sleep reveal the meditation timer
                 (OM & Sleep also toggle their ambient loop via meditate ids).
                 Stretch / Weights / Tennis / Guided open the practice panel. -->
            <button type="button" class="orbit-icon" data-mode="breathe" style="--a:-90deg" aria-label="Breathe — guided session">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M5 8h8.5a2.5 2.5 0 1 0 -2.5 -2.5"></path>
                        <path d="M3 12h15a3 3 0 1 1 -3 3"></path>
                        <path d="M4 16h6.5a2 2 0 1 1 -2 2"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Breathe</span>
            </button>

            <button id="meditate-om-toggle" type="button" class="orbit-icon" data-mode="om" style="--a:-38.571deg" aria-pressed="false" aria-label="OM chant">
                <span class="orbit-icon__glyph orbit-icon__glyph--om" aria-hidden="true">ॐ</span>
                <span class="orbit-icon__label">OM</span>
            </button>

            <button id="meditate-sleep-toggle" type="button" class="orbit-icon" data-mode="sleep" style="--a:12.857deg" aria-pressed="false" aria-label="Sleep music">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Sleep</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="stretch" style="--a:64.286deg" aria-expanded="false" aria-controls="being-panel" aria-label="Stretch routines">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="9" cy="4.5" r="1.8"></circle>
                        <path d="M9 6.5c0 4 3 5.5 6.5 5.5"></path>
                        <path d="M9 8.5l-2.5 6"></path>
                        <path d="M15 12l2 5"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Stretch</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="weights" style="--a:115.714deg" aria-expanded="false" aria-controls="being-panel" aria-label="Weight training plan">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="12" r="3"></circle>
                        <path d="M9 12h6"></path>
                        <path d="M6 9v6"></path>
                        <path d="M18 9v6"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Weights</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="tennis" style="--a:167.143deg" aria-expanded="false" aria-controls="being-panel" aria-label="Tennis stretches">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M4 7c4 2.5 12 2.5 16 0"></path>
                        <path d="M4 17c4-2.5 12-2.5 16 0"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Tennis</span>
            </button>

            <button type="button" class="orbit-icon" data-panel="guided" style="--a:218.571deg" aria-expanded="false" aria-controls="being-panel" aria-label="Guided meditation">
                <span class="orbit-icon__glyph">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M10 8.5l5.5 3.5-5.5 3.5z"></path>
                    </svg>
                </span>
                <span class="orbit-icon__label">Guided</span>
            </button>
        </section>

        <!-- Activity stage — hidden until a practice is tapped. Holds either the
             meditation timer (Breathe / OM / Sleep) or the practice panel
             (Stretch / Weights / Tennis / Guided). One at a time. -->
        <section id="being-stage" class="being-stage" aria-live="polite" hidden>
            <button type="button" id="being-stage-close" class="being-stage__close" aria-label="Return to stillness">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M15 6l-6 6 6 6"></path>
                </svg>
                <span>Stillness</span>
            </button>

            <!-- Meditation timer — revealed by Breathe / OM / Sleep. -->
            <div id="being-meditate" class="being-meditate" hidden>
                <div class="meditate-stage">
                    <div id="meditate-display" class="meditate-display" role="timer" aria-live="polite">10:00</div>
                    <p id="meditate-status" class="meditate-status">10 minute session</p>
                    <button id="meditate-toggle" type="button" class="panel-btn meditate-btn" aria-pressed="false">Start</button>
                    <section class="meditate-presets" aria-label="Session length">
                        <button type="button" class="meditate-preset" data-duration="5" aria-pressed="false">5 min</button>
                        <button type="button" class="meditate-preset" data-duration="10" aria-pressed="true">10 min</button>
                        <button type="button" class="meditate-preset" data-duration="20" aria-pressed="false">20 min</button>
                    </section>
                </div>

                <section id="meditate-breath" class="meditate-breath" aria-hidden="true">
                    <div class="meditate-breath__stage">
                        <div class="meditate-breath__ring"></div>
                        <span class="meditate-breath__label meditate-breath__label--inhale">Breathe in</span>
                        <span class="meditate-breath__label meditate-breath__label--hold-1">Hold</span>
                        <span class="meditate-breath__label meditate-breath__label--exhale">Breathe out</span>
                        <span class="meditate-breath__label meditate-breath__label--hold-2">Hold</span>
                    </div>
                </section>

                <!-- Breath-chime toggle. OM & Sleep live in the orbit; the chime
                     is the one ambient control that belongs with the timer. -->
                <div class="being-sounds" role="group" aria-label="Ambient sound">
                    <button id="meditate-breathe-toggle" type="button" class="being-sound-toggle" aria-pressed="true" aria-label="Breath chime">
                        <span class="being-sound-toggle__glyph">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M11 5 6 9H2v6h4l5 4z"></path>
                                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                                <path d="M19 5a9 9 0 0 1 0 14"></path>
                            </svg>
                        </span>
                        <span>Chime</span>
                    </button>
                </div>
            </div>

            <!-- Practice panel — Stretch / Weights / Tennis / Guided. -->
            <div id="being-panel" class="being-panel" hidden></div>
        </section>
    </div>

    <script type="module" src="src/pages/being.ts"></script>
</body>
</html>
