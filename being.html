<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Being — It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    <link rel="icon" href="/vitruvian-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">
    <div id="app-container" class="app-container being-page meditate-page">
        <nav class="page-back-nav">
            <a href="index.html" class="home-link">← Home</a>
        </nav>

        <header class="text-center mb-6">
            <div class="flex justify-center items-center">
                <h1>Being</h1>
                <span class="theme-icon" aria-hidden="true">🪷</span>
            </div>
        </header>

        <!-- Stillness — the meditation timer is the resting state of the page. -->
        <section class="being-core">
            <div class="meditate-stage">
                <div id="meditate-display" class="meditate-display" role="timer" aria-live="polite">10:00</div>
                <p id="meditate-status" class="meditate-status">10 minute session</p>
                <button id="meditate-toggle" type="button" class="panel-btn meditate-btn" aria-pressed="false">Start</button>
                <section class="meditate-presets" aria-label="Session length">
                    <button type="button" class="meditate-preset" data-duration="5" aria-pressed="false">5 min</button>
                    <button type="button" class="meditate-preset" data-duration="10" aria-pressed="true">10 min</button>
                    <button type="button" class="meditate-preset" data-duration="20" aria-pressed="false">20 min</button>
                </section>
            </div>

            <section id="meditate-breath" class="meditate-breath" aria-hidden="true">
                <div class="meditate-breath__stage">
                    <div class="meditate-breath__ring"></div>
                    <span class="meditate-breath__label meditate-breath__label--inhale">Breathe in</span>
                    <span class="meditate-breath__label meditate-breath__label--hold-1">Hold</span>
                    <span class="meditate-breath__label meditate-breath__label--exhale">Breathe out</span>
                    <span class="meditate-breath__label meditate-breath__label--hold-2">Hold</span>
                </div>
            </section>
        </section>

        <!-- One dock. Every practice lives here as a small captioned icon.
             Breathe / OM / Sleep are ambient toggles; the rest open an inline
             panel below. No top-level Meditate vs Exercise split. -->
        <div class="being-dock" role="group" aria-label="Being practices">
            <button id="meditate-breathe-toggle" type="button" class="being-dock__item" data-kind="toggle" aria-pressed="true" aria-label="Breath chime">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M5 8h8.5a2.5 2.5 0 1 0 -2.5 -2.5"></path>
                        <path d="M3 12h15a3 3 0 1 1 -3 3"></path>
                        <path d="M4 16h6.5a2 2 0 1 1 -2 2"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Breathe</span>
            </button>

            <button id="meditate-om-toggle" type="button" class="being-dock__item" data-kind="toggle" aria-pressed="false" aria-label="OM chant">
                <span class="being-dock__icon being-dock__icon--om" aria-hidden="true">ॐ</span>
                <span class="being-dock__label">OM</span>
            </button>

            <button id="meditate-sleep-toggle" type="button" class="being-dock__item" data-kind="toggle" aria-pressed="false" aria-label="Sleep music">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Sleep</span>
            </button>

            <button type="button" class="being-dock__item" data-panel="stretch" aria-expanded="false" aria-controls="being-panel" aria-label="Stretch routines">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="9" cy="4.5" r="1.8"></circle>
                        <path d="M9 6.5c0 4 3 5.5 6.5 5.5"></path>
                        <path d="M9 8.5l-2.5 6"></path>
                        <path d="M15 12l2 5"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Stretch</span>
            </button>

            <button type="button" class="being-dock__item" data-panel="weights" aria-expanded="false" aria-controls="being-panel" aria-label="Weight training plan">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="12" r="3"></circle>
                        <path d="M9 12h6"></path>
                        <path d="M6 9v6"></path>
                        <path d="M18 9v6"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Weights</span>
            </button>

            <button type="button" class="being-dock__item" data-panel="tennis" aria-expanded="false" aria-controls="being-panel" aria-label="Tennis stretches">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M4 7c4 2.5 12 2.5 16 0"></path>
                        <path d="M4 17c4-2.5 12-2.5 16 0"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Tennis</span>
            </button>

            <button type="button" class="being-dock__item" data-panel="guided" aria-expanded="false" aria-controls="being-panel" aria-label="Guided meditation">
                <span class="being-dock__icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M10 8.5l5.5 3.5-5.5 3.5z"></path>
                    </svg>
                </span>
                <span class="being-dock__label">Guided</span>
            </button>
        </div>

        <section id="being-panel" class="being-panel" aria-live="polite" hidden></section>
    </div>

    <script type="module" src="src/pages/being.ts"></script>
</body>
</html>
