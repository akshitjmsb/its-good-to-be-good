<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Crown icon — compact square format for favicon/app icon -->

  <!-- Crown zigzag -->
  <polyline
    points="12,78 12,42 32,58 50,18 68,58 88,42 88,78"
    fill="none"
    stroke="#111111"
    stroke-width="4"
    stroke-linejoin="miter"
    stroke-linecap="square"
  />

  <!-- Crown band -->
  <rect x="12" y="68" width="76" height="12" fill="#111111"/>

  <!-- Peak tip dots -->
  <circle cx="12" cy="42" r="5.5" fill="#111111"/>
  <circle cx="50" cy="18" r="5.5" fill="#111111"/>
  <circle cx="88" cy="42" r="5.5" fill="#111111"/>
</svg>
