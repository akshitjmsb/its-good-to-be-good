<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do - Mr. Mojo Rising</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>
    <div id="app-container" class="app-container">
        <!-- Header -->
        <header class="text-center mb-6">
            <div class="logo-container flex justify-center">
                <svg class="logo-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                    <title>Mr. Mojo Rising Logo</title>
                    <path d="M70,35 C 72,50 68,65 65,68" />
                    <path d="M60,25 C 62,45 58,68 55,70" />
                    <path d="M50,23 C 52,43 48,70 45,72" />
                    <path d="M40,28 C 42,48 38,68 35,70" />
                </svg>
            </div>
            <div class="flex justify-center items-center">
                <h1>To Do</h1>
                <span class="theme-icon">📝</span>
            </div>
            <p class="text-xs mt-2">Task management</p>
        </header>

        <!-- Navigation -->
        <nav class="text-center mb-6">
            <a href="index.html" class="todo-toggle-button">
                <h2>← Back to Dashboard</h2>
            </a>
        </nav>

        <!-- Task Section -->
        <section class="mobile-section">
            <h2 class="text-center mb-4">Tasks</h2>
            <div id="tasks-list-todo" class="mb-4"></div>

            <!-- Add Task Form -->
            <form id="add-task-form-todo" class="add-task-form flex">
                <input type="text" placeholder="Add a new task..." class="flex-grow p-3 border border-gray-300 rounded-l-md text-sm focus:outline-none">
                <button type="submit" class="add-btn-icon ml-2">➕</button>
            </form>
        </section>

        <!-- Statistics Section -->
        <section class="mobile-section">
            <h2 class="text-center mb-4">Statistics</h2>
            <div class="grid grid-cols-3 gap-3">
                <div class="preview-card text-center">
                    <div class="text-2xl font-bold text-gray-700" id="total-tasks">0</div>
                    <div class="text-xs text-gray-600">Total</div>
                </div>
                <div class="preview-card text-center">
                    <div class="text-2xl font-bold text-green-600" id="completed-tasks">0</div>
                    <div class="text-xs text-gray-600">Completed</div>
                </div>
                <div class="preview-card text-center">
                    <div class="text-2xl font-bold text-blue-600" id="pending-tasks">0</div>
                    <div class="text-xs text-gray-600">Pending</div>
                </div>
            </div>
        </section>

        <!-- Quick Actions Section -->
        <section class="mobile-section">
            <h2 class="text-center mb-4">Quick Actions</h2>
            <div class="grid grid-cols-1 gap-3">
                <button id="clear-completed" class="todo-toggle-button">
                    <h2>Clear Completed</h2>
                </button>
                <button id="mark-all-complete" class="todo-toggle-button">
                    <h2>Mark All Complete</h2>
                </button>
            </div>
        </section>
    </div>

    <script type="module" src="src/todo.tsx"></script>
</body>
</html>
