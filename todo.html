<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do — It's Good To Be King</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/index.css">
    <link rel="stylesheet" href="src/styles/home-lock.css">
    <link rel="icon" href="/vitruvian-logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="It's Good To Be King">
    <meta name="theme-color" content="#111111">
</head>
<body class="home-vintage-lock">
    <div id="app-container" class="app-container todo-page">
        <header class="todo-header">
            <a href="index.html" class="todo-back" aria-label="Back to home">← Home</a>
            <h1 class="todo-title">To Do</h1>
        </header>

        <form id="add-task-form-todo" class="todo-add-form" autocomplete="off" action="#">
            <input
                id="todo-input"
                type="text"
                inputmode="text"
                enterkeyhint="done"
                autocomplete="off"
                autocapitalize="sentences"
                spellcheck="true"
                placeholder="Add a task and press return"
                aria-label="Add a task"
            >
            <!-- Mobile Safari needs an explicit submit control to fire the
                 form's submit event reliably when Return is pressed in a
                 single-field form. Hidden visually but kept in the form. -->
            <button type="submit" class="sr-only" tabindex="-1" aria-hidden="true">Add task</button>
        </form>

        <p id="todo-counter" class="todo-counter" aria-live="polite"></p>

        <div id="tasks-list-todo" class="todo-list" role="list"></div>
    </div>

    <script type="module" src="src/todo.tsx"></script>
</body>
</html>
