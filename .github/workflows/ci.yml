name: CI/CD Pipeline

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full verification gates
        run: npm run verify
